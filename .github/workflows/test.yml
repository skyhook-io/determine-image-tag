name: Test Action

on:
  push:
    branches: [main, develop, debug-counter-issue]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit tests (tests/test_generate_tag.sh)
    steps:
      - uses: actions/checkout@v4
      - name: Run unit test harness
        run: bash tests/test_generate_tag.sh

  test-truncation-regressions:
    runs-on: ubuntu-latest
    name: "Regression: tag truncation bug fixes"
    steps:
      - uses: actions/checkout@v4

      # --- User-reported invariant ---
      # service-branch-date-counter + counter=on should ALWAYS end with _DATE_NN.
      - name: "User case: service-branch-date-counter + counter=on, long branch"
        id: user-case
        uses: ./
        with:
          service_name: backend
          tag_format: service-branch-date-counter
          include_counter: true
          branch_ref: "refs/heads/ggg_uni-rrrr-reintrrrrr-xxxx-ttt-fff-rrtt"

      - name: "Verify user case ends with _DATE_NN and fits 63 chars"
        run: |
          TAG="${{ steps.user-case.outputs.tag }}"
          echo "Tag: $TAG (len=${#TAG})"
          if [[ ! "$TAG" =~ _[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2,}$ ]]; then
            echo "❌ Tag does not end in _DATE_NN"
            exit 1
          fi
          if [ ${#TAG} -gt 63 ]; then
            echo "❌ Tag exceeds 63 chars"
            exit 1
          fi
          echo "✅ User case OK"

      # --- Bug 1: trailing '-' when branch is last + counter=off + cut on '-' ---
      # AVAIL_BRANCH for date-branch (no svc, no counter) = 52.
      # Branch is 51 'a' + '-' + 'rest' = 56 chars. Truncating to 52 lands ON '-'.
      # Pre-fix: tag ended in '-'. Post-fix: trailing '-' trimmed.
      - name: "Bug 1: branch-last + counter=off + dash-cut"
        id: bug1
        uses: ./
        with:
          tag_format: date-branch
          include_counter: false
          branch_ref: "refs/heads/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-rest"

      - name: "Verify no trailing separator (bug 1)"
        run: |
          TAG="${{ steps.bug1.outputs.tag }}"
          echo "Tag: $TAG"
          if [[ "$TAG" =~ [-_]$ ]]; then
            echo "❌ Tag ends in separator"
            exit 1
          fi
          echo "✅ No trailing separator"

      # Same bug, different branch-last format.
      - name: "Bug 1b: service-date-branch + counter=off + dash-cut"
        id: bug1b
        uses: ./
        with:
          service_name: backend
          tag_format: service-date-branch
          include_counter: false
          branch_ref: "refs/heads/yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy-rest"

      - name: "Verify no trailing separator (bug 1b)"
        run: |
          TAG="${{ steps.bug1b.outputs.tag }}"
          echo "Tag: $TAG"
          if [[ "$TAG" =~ [-_]$ ]]; then
            echo "❌ Tag ends in separator"
            exit 1
          fi
          echo "✅ No trailing separator"

      # --- Bug 2: custom_tag truncation cuts on '-' ---
      - name: "Bug 2: custom_tag truncation at '-'"
        id: bug2
        uses: ./
        with:
          custom_tag: "aaaaa-bbbbb-ccccc-ddddd-eeeee"
          max_length: "18"

      - name: "Verify no trailing separator (bug 2)"
        run: |
          TAG="${{ steps.bug2.outputs.tag }}"
          echo "Tag: $TAG (len=${#TAG})"
          if [[ "$TAG" =~ [-_]$ ]]; then
            echo "❌ Custom tag ends in separator"
            exit 1
          fi
          if [ ${#TAG} -gt 18 ]; then
            echo "❌ Custom tag exceeds max_length"
            exit 1
          fi
          echo "✅ Custom tag OK"

      # --- Bug 3: tiny max_length used to produce '__' / overflow ---
      - name: "Bug 3: service format + tiny max_length"
        id: bug3
        uses: ./
        with:
          service_name: some-service
          tag_format: service-branch-date-counter
          include_counter: true
          max_length: "30"
          branch_ref: "refs/heads/feature-some-long-branch-name"

      - name: "Verify no '__' and within max_length (bug 3)"
        run: |
          TAG="${{ steps.bug3.outputs.tag }}"
          echo "Tag: $TAG (len=${#TAG})"
          if [[ "$TAG" == *"__"* ]]; then
            echo "❌ Tag contains '__' double separator"
            exit 1
          fi
          if [ ${#TAG} -gt 30 ]; then
            echo "❌ Tag exceeds max_length=30"
            exit 1
          fi
          echo "✅ Tiny max_length OK"

      # --- Bug 4: max_length too small for fixed parts should error ---
      - name: "Bug 4: max_length too small errors out"
        id: bug4
        continue-on-error: true
        uses: ./
        with:
          tag_format: date-branch-counter
          include_counter: true
          max_length: "10"

      - name: "Verify previous step failed (bug 4)"
        run: |
          if [ "${{ steps.bug4.outcome }}" = "success" ]; then
            echo "❌ Action should have failed with max_length=10"
            exit 1
          fi
          echo "✅ Action correctly errored on max_length too small"

      # --- Bug 5: SERVICE_NAME must not affect tag when format ignores service ---
      - name: "Bug 5a: branch-date with SERVICE_NAME"
        id: bug5a
        uses: ./
        with:
          service_name: some-service
          tag_format: branch-date-counter
          max_length: "30"
          branch_ref: "refs/heads/feature-auth-rewrite-token-issuer"

      - name: "Bug 5b: branch-date without SERVICE_NAME"
        id: bug5b
        uses: ./
        with:
          tag_format: branch-date-counter
          max_length: "30"
          branch_ref: "refs/heads/feature-auth-rewrite-token-issuer"

      - name: "Verify SERVICE_NAME has no effect on branch-date"
        run: |
          T1="${{ steps.bug5a.outputs.tag }}"
          T2="${{ steps.bug5b.outputs.tag }}"
          echo "with service:    $T1"
          echo "without service: $T2"
          if [ "$T1" != "$T2" ]; then
            echo "❌ SERVICE_NAME affected branch-date output"
            exit 1
          fi
          echo "✅ SERVICE_NAME correctly ignored"

  test-basic:
    runs-on: ubuntu-latest
    name: Test Basic Tag Generation
    steps:
      - uses: actions/checkout@v4
      
      - name: Test with service name
        uses: ./
        id: test1
        with:
          service_name: test-service
          
      - name: Verify outputs
        run: |
          echo "Tag: ${{ steps.test1.outputs.tag }}"
          echo "Commit: ${{ steps.test1.outputs.commit_hash }}"
          echo "Branch: ${{ steps.test1.outputs.branch }}"
          
          # Verify tag format
          TAG="${{ steps.test1.outputs.tag }}"
          echo "Verifying tag format: $TAG"
          if [[ ! "$TAG" =~ ^test-service_[0-9]{4}-[0-9]{2}-[0-9]{2}_[^_]+_[0-9]{2}$ ]]; then
            echo "ERROR: Tag format is incorrect"
            echo "Expected pattern: test-service_YYYY-MM-DD_branch_NN"
            echo "Actual tag: $TAG"
            exit 1
          fi
          echo "✅ Tag format is correct"

  test-formats:
    runs-on: ubuntu-latest
    name: Test Different Tag Formats
    steps:
      - uses: actions/checkout@v4
      
      - name: Test branch-date-counter format
        uses: ./
        id: test-branch-date
        with:
          tag_format: branch-date-counter
          
      - name: Test date-branch format
        uses: ./
        id: test-date-branch
        with:
          tag_format: date-branch
          include_counter: false
          
      - name: Verify formats
        run: |
          echo "Branch-Date format: ${{ steps.test-branch-date.outputs.tag }}"
          echo "Date-Branch format: ${{ steps.test-date-branch.outputs.tag }}"
          
          # Verify no counter in date-branch format
          if [[ "${{ steps.test-date-branch.outputs.tag }}" =~ _[0-9]{2}$ ]]; then
            echo "ERROR: Counter should not be present"
            exit 1
          fi

  test-custom-tag:
    runs-on: ubuntu-latest
    name: Test Custom Tag
    steps:
      - uses: actions/checkout@v4
      
      - name: Test with custom tag
        uses: ./
        id: test-custom
        with:
          custom_tag: "v1.2.3/release:candidate"
          
      - name: Verify custom tag normalization
        run: |
          echo "Custom tag: ${{ steps.test-custom.outputs.tag }}"
          
          # Verify special characters are replaced with default separator (-)
          if [[ "${{ steps.test-custom.outputs.tag }}" != "v1.2.3-release-candidate" ]]; then
            echo "ERROR: Custom tag not normalized correctly"
            echo "Expected: v1.2.3-release-candidate"
            echo "Actual: ${{ steps.test-custom.outputs.tag }}"
            exit 1
          fi

  test-custom-separator:
    runs-on: ubuntu-latest
    name: Test Custom Branch Separator
    steps:
      - uses: actions/checkout@v4
      
      - name: Test with underscore separator and mock branch
        uses: ./
        id: test-underscore
        with:
          service_name: api
          branch_separator: "_"
          branch_ref: "refs/heads/feature/new-api"
          
      - name: Verify underscore separator
        run: |
          echo "Tag: ${{ steps.test-underscore.outputs.tag }}"
          BRANCH="${{ steps.test-underscore.outputs.branch }}"
          echo "Branch output: $BRANCH"
          
          # The branch should have underscore separator
          if [[ "$BRANCH" == "feature_new-api" ]]; then
            echo "✅ Custom separator works correctly"
          else
            echo "ERROR: Branch separator not applied correctly"
            echo "Expected: feature_new-api"
            echo "Actual: $BRANCH"
            # Don't fail for now, just warn
            echo "⚠️  Note: branch_ref input may not work as expected in composite actions"
          fi

  test-length-limits:
    runs-on: ubuntu-latest
    name: Test Length Limits
    steps:
      - uses: actions/checkout@v4
      
      - name: Test with long service name
        uses: ./
        id: test-long
        with:
          service_name: "this-is-a-very-long-service-name-that-exceeds-normal-limits"
          max_length: 40
          
      - name: Verify length limit
        run: |
          TAG="${{ steps.test-long.outputs.tag }}"
          echo "Tag: $TAG"
          TAG_LENGTH=${#TAG}
          
          if [ $TAG_LENGTH -gt 40 ]; then
            echo "ERROR: Tag length ($TAG_LENGTH) exceeds limit (40)"
            exit 1
          fi
          echo "✅ Tag length ($TAG_LENGTH) is within limit (40)"
      
      - name: Test custom tag truncation
        uses: ./
        id: test-custom-truncate
        with:
          custom_tag: "this-is-an-extremely-long-custom-tag-that-definitely-needs-truncation"
          max_length: 30
          
      - name: Verify custom tag truncation
        run: |
          TAG="${{ steps.test-custom-truncate.outputs.tag }}"
          echo "Truncated custom tag: $TAG"
          TAG_LENGTH=${#TAG}
          
          if [ $TAG_LENGTH -gt 30 ]; then
            echo "ERROR: Custom tag length ($TAG_LENGTH) exceeds limit (30)"
            exit 1
          fi
          echo "✅ Custom tag truncated correctly to $TAG_LENGTH characters"
      
      - name: Test tag without counter truncation
        uses: ./
        id: test-no-counter-truncate
        with:
          service_name: "very-long-service-name"
          tag_format: "service-date-branch-counter"
          include_counter: false
          max_length: 35
          branch_ref: "refs/heads/feature/long-branch-name"
          
      - name: Verify no-counter truncation
        run: |
          TAG="${{ steps.test-no-counter-truncate.outputs.tag }}"
          echo "Tag without counter: $TAG"
          TAG_LENGTH=${#TAG}
          
          if [ $TAG_LENGTH -gt 35 ]; then
            echo "ERROR: Tag length ($TAG_LENGTH) exceeds limit (35)"
            exit 1
          fi
          echo "✅ Tag without counter truncated correctly to $TAG_LENGTH characters"
      
      - name: Test very long branch name truncation preserves date
        uses: ./
        id: test-preserve-date
        with:
          tag_format: "branch-date-counter"
          branch_ref: "refs/heads/dev-12345-some-long-branch-name-very-long-indeeeeeeeeeeeed"
          max_length: 63
          include_counter: true
          
      - name: Verify date is preserved in truncation
        run: |
          TAG="${{ steps.test-preserve-date.outputs.tag }}"
          echo "Tag with long branch: $TAG"
          TAG_LENGTH=${#TAG}
          
          # Check tag doesn't exceed limit
          if [ $TAG_LENGTH -gt 63 ]; then
            echo "ERROR: Tag length ($TAG_LENGTH) exceeds limit (63)"
            exit 1
          fi
          
          # Verify date pattern is intact (YYYY-MM-DD format)
          if [[ ! "$TAG" =~ [0-9]{4}-[0-9]{2}-[0-9]{2} ]]; then
            echo "ERROR: Date was corrupted during truncation"
            echo "Tag: $TAG"
            echo "Expected to contain pattern: YYYY-MM-DD"
            exit 1
          fi
          
          # Verify counter suffix is intact
          if [[ ! "$TAG" =~ _[0-9]{2}$ ]]; then
            echo "ERROR: Counter suffix was corrupted during truncation"
            echo "Tag: $TAG"
            echo "Expected to end with: _NN"
            exit 1
          fi
          
          echo "✅ Date and counter preserved correctly in truncation"

  test-counter:
    runs-on: ubuntu-latest
    name: Test Counter Logic
    steps:
      - uses: actions/checkout@v4
        with:
          path: action-src

      # Build a self-contained test repo with a local bare remote so
      # git ls-remote --tags origin works against tags we control.
      - name: Setup test repo with local remote
        id: setup
        run: |
          # Create bare "remote" and a working clone
          git init --bare /tmp/test-remote.git
          git clone /tmp/test-remote.git /tmp/test-repo
          cd /tmp/test-repo
          git config user.email "test@test.com"
          git config user.name "Test"
          git checkout -b main
          git commit --allow-empty -m "init"
          git push -u origin main

          # Use a unique prefix so tests don't collide
          TEST_ID="ct-$$-$RANDOM"
          echo "test_id=$TEST_ID" >> $GITHUB_OUTPUT
          TODAY=$(date +'%Y-%m-%d')
          echo "today=$TODAY" >> $GITHUB_OUTPUT

      # --- Test 1: fresh counter starts at 01 ---
      - name: "Counter: starts at 01 when no existing tags"
        uses: ./action-src
        id: fresh
        with:
          service_name: ${{ steps.setup.outputs.test_id }}
          tag_format: service-branch-date-counter
          include_counter: true
          working_directory: /tmp/test-repo
          branch_ref: refs/heads/main

      - name: Verify fresh counter
        run: |
          TAG="${{ steps.fresh.outputs.tag }}"
          echo "Fresh tag: $TAG"
          [[ "$TAG" == *"_01" ]] || { echo "❌ Expected _01 suffix"; exit 1; }
          echo "✅ Fresh counter starts at _01"

      # --- Test 2: sequential increment (_01 exists -> _02) ---
      - name: Push first tag to remote
        run: |
          cd /tmp/test-repo
          git tag "${{ steps.fresh.outputs.tag }}"
          git push origin "${{ steps.fresh.outputs.tag }}"

      - name: "Counter: increments to 02 after 01 exists"
        uses: ./action-src
        id: second
        with:
          service_name: ${{ steps.setup.outputs.test_id }}
          tag_format: service-branch-date-counter
          include_counter: true
          working_directory: /tmp/test-repo
          branch_ref: refs/heads/main

      - name: Verify increment
        run: |
          TAG1="${{ steps.fresh.outputs.tag }}"
          TAG2="${{ steps.second.outputs.tag }}"
          echo "First:  $TAG1"
          echo "Second: $TAG2"
          [[ "$TAG2" == *"_02" ]] || { echo "❌ Expected _02 suffix"; exit 1; }
          [ "$TAG1" != "$TAG2" ] || { echo "❌ Tags must differ"; exit 1; }
          echo "✅ Counter incremented to _02"

      # --- Test 3: gap handling (_01 and _05 exist -> _06) ---
      - name: Create tags with gap
        env:
          TEST_ID: ${{ steps.setup.outputs.test_id }}
          TODAY: ${{ steps.setup.outputs.today }}
        run: |
          cd /tmp/test-repo
          git tag "${TEST_ID}-gap_main_${TODAY}_01"
          git tag "${TEST_ID}-gap_main_${TODAY}_05"
          git push origin --tags

      - name: "Counter: skips gap, goes to 06"
        uses: ./action-src
        id: gap
        with:
          service_name: ${{ steps.setup.outputs.test_id }}-gap
          tag_format: service-branch-date-counter
          include_counter: true
          working_directory: /tmp/test-repo
          branch_ref: refs/heads/main

      - name: Verify gap handling
        run: |
          TAG="${{ steps.gap.outputs.tag }}"
          echo "After gap: $TAG"
          [[ "$TAG" == *"_06" ]] || { echo "❌ Expected _06 suffix"; exit 1; }
          echo "✅ Counter correctly jumped past gap to _06"

      # --- Test 4: counter disabled produces no suffix ---
      - name: "Counter: disabled produces no _NN suffix"
        uses: ./action-src
        id: no-counter
        with:
          service_name: ${{ steps.setup.outputs.test_id }}-nc
          tag_format: service-branch-date-counter
          include_counter: false
          working_directory: /tmp/test-repo
          branch_ref: refs/heads/main

      - name: Verify no counter
        run: |
          TAG="${{ steps.no-counter.outputs.tag }}"
          echo "No-counter tag: $TAG"
          if [[ "$TAG" =~ _[0-9][0-9]$ ]]; then
            echo "❌ Should not have counter suffix"
            exit 1
          fi
          echo "✅ No counter suffix when disabled"

  test-pull-request:
    runs-on: ubuntu-latest
    name: Test Pull Request Handling
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Test PR branch detection
        uses: ./
        id: test-pr
        with:
          service_name: pr-test
          
      - name: Verify PR branch
        run: |
          echo "Branch from PR: ${{ steps.test-pr.outputs.branch }}"
          
          # Should use the PR head ref, not the base branch
          if [[ "${{ steps.test-pr.outputs.branch }}" == "main" ]]; then
            echo "ERROR: Should use PR branch, not base branch"
            exit 1
          fi